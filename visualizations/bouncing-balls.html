<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing Balls</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #5d6677;
    --border: #d9dde5;
    --floor: #c9ced8;
    --accent: #3b6fe0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --panel: #1b1f27;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --border: #2d3340;
      --floor: #3a4150;
      --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 16px;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  p.hint { margin: 0; color: var(--muted); }
  .stage {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 480px; cursor: crosshair; touch-action: none; }
  .controls {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
  }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { accent-color: var(--accent); width: 140px; }
  output { color: var(--text); font-variant-numeric: tabular-nums; min-width: 3ch; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>Bouncing Balls</h1>
  <p class="hint">Click or tap the box to drop a new ball. Balls bounce off the walls and each other.</p>

  <div class="stage"><canvas id="c"></canvas></div>

  <div class="controls">
    <label>Gravity <input id="gravity" type="range" min="0" max="3000" step="50" value="1400"><output id="gravityOut"></output></label>
    <label>Bounciness <input id="bounce" type="range" min="0.3" max="1" step="0.01" value="0.85"><output id="bounceOut"></output></label>
    <button id="pause">Pause</button>
    <button id="clear">Reset</button>
    <span class="count" id="count"></span>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const gravityEl = document.getElementById('gravity');
  const bounceEl = document.getElementById('bounce');
  const gravityOut = document.getElementById('gravityOut');
  const bounceOut = document.getElementById('bounceOut');
  const pauseBtn = document.getElementById('pause');
  const countEl = document.getElementById('count');

  const MAX_BALLS = 60;
  const palette = ['#e4572e', '#3b6fe0', '#2bb673', '#f2a541', '#9b5de5', '#ef476f', '#17bebb'];
  let balls = [];
  let paused = false;
  let width = 0, height = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const b of balls) {
      b.x = Math.min(Math.max(b.x, b.r), width - b.r);
      b.y = Math.min(b.y, height - b.r);
    }
    // The page may first lay out at zero size (e.g. in a hidden pane); seed once it has room.
    if (!balls.length && width > 0) seed();
  }

  function addBall(x, y) {
    const r = 12 + Math.random() * 18;
    balls.push({
      x: Math.min(Math.max(x, r), width - r),
      y: Math.min(Math.max(y, r), height - r),
      vx: (Math.random() - 0.5) * 500,
      vy: -Math.random() * 300,
      r,
      m: r * r,
      color: palette[balls.length % palette.length],
    });
    if (balls.length > MAX_BALLS) balls.shift();
    updateCount();
  }

  function seed() {
    balls = [];
    for (let i = 0; i < 6; i++) addBall(80 + Math.random() * (width - 160), 40 + Math.random() * 120);
  }

  function updateCount() {
    countEl.textContent = balls.length + (balls.length === 1 ? ' ball' : ' balls');
  }

  function step(dt) {
    const g = +gravityEl.value;
    const e = +bounceEl.value;

    for (const b of balls) {
      b.vy += g * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * e; }
      else if (b.x + b.r > width) { b.x = width - b.r; b.vx = -Math.abs(b.vx) * e; }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) * e; }
      else if (b.y + b.r > height) {
        b.y = height - b.r;
        b.vy = -Math.abs(b.vy) * e;
        b.vx *= Math.pow(0.7, dt); // a touch of rolling friction
        if (Math.abs(b.vy) < 20) b.vy = 0;
      }
    }

    // Ball-ball collisions (elastic impulse scaled by bounciness)
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy);
        const minDist = a.r + b.r;
        if (dist === 0 || dist >= minDist) continue;

        const nx = dx / dist, ny = dy / dist;
        // Separate overlapping balls proportionally to mass
        const overlap = minDist - dist;
        const total = a.m + b.m;
        a.x -= nx * overlap * (b.m / total);
        a.y -= ny * overlap * (b.m / total);
        b.x += nx * overlap * (a.m / total);
        b.y += ny * overlap * (a.m / total);

        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel > 0) continue; // already separating
        const impulse = -(1 + e) * rel / (1 / a.m + 1 / b.m);
        a.vx -= impulse * nx / a.m;
        a.vy -= impulse * ny / a.m;
        b.vx += impulse * nx / b.m;
        b.vy += impulse * ny / b.m;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    const floorColor = getComputedStyle(document.documentElement).getPropertyValue('--floor');
    for (const b of balls) {
      // Shadow on the floor, smaller and fainter the higher the ball is
      const h = Math.min(1, (height - b.y - b.r) / height);
      ctx.fillStyle = floorColor;
      ctx.globalAlpha = 0.6 * (1 - h);
      ctx.beginPath();
      ctx.ellipse(b.x, height - 3, b.r * (1 - 0.5 * h), 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const b of balls) {
      const grad = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
      grad.addColorStop(0, '#ffffffcc');
      grad.addColorStop(0.25, b.color);
      grad.addColorStop(1, b.color);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!paused) {
      // Substeps keep fast balls from tunnelling through each other
      for (let s = 0; s < 4; s++) step(dt / 4);
    }
    draw();
    requestAnimationFrame(frame);
  }

  function syncOutputs() {
    gravityOut.textContent = gravityEl.value;
    bounceOut.textContent = (+bounceEl.value).toFixed(2);
  }

  canvas.addEventListener('pointerdown', (ev) => {
    const rect = canvas.getBoundingClientRect();
    addBall(ev.clientX - rect.left, ev.clientY - rect.top);
  });
  gravityEl.addEventListener('input', syncOutputs);
  bounceEl.addEventListener('input', syncOutputs);
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  });
  document.getElementById('clear').addEventListener('click', seed);
  window.addEventListener('resize', resize);

  syncOutputs();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

name: Preview HTML pages

on:
  workflow_run:
    workflows: [Request session reports]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open same-repository PR whose HTML pages should be previewed
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  preview:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test preview packaging boundaries
        run: python -m unittest discover -s scripts -p 'test_html_previews.py' -v
      - name: Package exact PR-head HTML and static assets
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pull_request }}
        run: python scripts/html_previews.py --output "$RUNNER_TEMP/html-preview"
      - name: Upload interactive website preview
        if: steps.package.outputs.has_preview == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ runner.temp }}/html-preview/
          if-no-files-found: error
          retention-days: 14

name: Trailvault private cloud capture setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build test-only Trailvault runtime when present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .trailvault/cloud-runtime/Cargo.toml ]; then
            echo "No Trailvault cloud runtime on this branch; skipping test bootstrap."
            exit 0
          fi
          cargo build --locked --release --manifest-path .trailvault/cloud-runtime/Cargo.toml --bin trailvault
          runtime="$PWD/.trailvault/cloud-runtime/target/release/trailvault"
          source .trailvault/cloud-publication-env.sh
          git diff --exit-code -- .github/hooks/trailvault.json .trailvault/settings.json
          mv .github/hooks/trailvault.json "$(git rev-parse --git-path trailvault-cloud-hooks.json)"
          trap 'git restore -- .github/hooks/trailvault.json .trailvault/settings.json' EXIT
          if [ -f .trailvault/policy.json ]; then
            test "$GITHUB_REPOSITORY" = "madsbolaris/trailvault-capture-test"
            policy_sha="$(sha256sum .trailvault/policy.json | cut -d ' ' -f 1)"
            test "$policy_sha" = "454251230398b7f7e7bced28bc741f2832e04e8f7caf7c9c95d6ab8019218dae"
            "$runtime" consent --approve
          fi
          "$runtime" enable --cloud --push-sessions
          git restore -- .github/hooks/trailvault.json .trailvault/settings.json
          echo "Trailvault runtime and repository Git hooks installed for cloud test."
          if [ -f .github/actions/trailvault-export/action.yml ]; then
            install -m 755 "$runtime" .github/actions/trailvault-export/trailvault
          fi
      - name: Register automatic post-job checkpoint artifact export
        if: hashFiles('.trailvault/cloud-runtime/Cargo.toml') != '' && hashFiles('.github/actions/trailvault-export/action.yml') != ''
        uses: ./.github/actions/trailvault-export

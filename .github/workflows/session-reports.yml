name: Analyze PR sessions
run-name: Session reports (${{ github.event_name }})

on:
  workflow_run:
    workflows: [Request session reports]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open same-repository PR to analyze (also reruns after late checkpoint publication)
        required: true
        type: number

permissions: {}

jobs:
  resolve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve current same-repository PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pull_request }}
        run: python3 scripts/session_reports.py resolve
  reports:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: session-reports-pr-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test report contracts
        run: python -m unittest discover -s scripts -p 'test_session_reports.py' -v
      - name: Install integrity-pinned Copilot
        run: |
          npm ci --prefix session-review-runtime --ignore-scripts --no-audit --no-fund
          printf '%s/session-review-runtime/node_modules/.bin\n' "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: Build trusted checkpoint reader
        run: cargo build --locked --release --manifest-path .trailvault/cloud-runtime/Cargo.toml --bin trailvault
      - name: Analyze and publish
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
          REQUESTED_PR: ${{ needs.resolve.outputs.number }}
          REQUESTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          ulimit -c 0
          umask 077
          gh auth setup-git --hostname github.com
          python scripts/session_reports.py run

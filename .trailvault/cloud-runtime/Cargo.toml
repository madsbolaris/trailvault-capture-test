[package]
name = "trailvault"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Preserve and share Copilot CLI sessions alongside Git commits"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
nix = { version = "0.30", features = ["poll", "signal", "process"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ulid = "1"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

[dev-dependencies]
libtest-mimic = "0.8"
portable-pty = "0.9"
vt100 = "0.15"

[[test]]
name = "contract"
harness = false

[[test]]
name = "supplementary"
harness = false

[[test]]
name = "restoration"
harness = false

[[test]]
name = "copilot_cloud"
harness = false

[[test]]
name = "native_capture"
harness = false

[[test]]
name = "claude_hosted"
harness = false

[[test]]
name = "codex_hosted"
harness = false

[[test]]
name = "classification"
harness = false

[[test]]
name = "relationships"
harness = false
